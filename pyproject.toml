[project]
name = "view-and-edit-herdr-plugin"
version = "0.2.0"
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL"]
# Messages are Japanese, where full-width punctuation is correct.
ignore = ["PLR2004", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# Tests drive the launcher and macOS tools (sips) through subprocess on purpose.
"tests/*" = ["S603", "S607", "S101"]
# Launching herdr and the viewer/editor is the whole job; argv lists, never a shell.
"view_and_edit/cli.py" = ["S603", "S606"]
"view_and_edit/media.py" = ["S603", "S606", "S607"]
"view_and_edit/editor.py" = ["S603"]

[tool.mypy]
strict = true
files = ["view_and_edit", "tests", "bin/view-and-edit"]
